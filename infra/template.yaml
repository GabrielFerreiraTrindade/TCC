AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  NetGuardian — framework serverless de detecção/remediação de anomalias de
  rede com Human-in-the-Loop. 3 Lambdas detectoras publicam AnomalyEvents em
  um EventBridge bus; um Notifier envia alertas ao Telegram; um Webhook
  (atrás do único API Gateway público) executa a remediação aprovada.

Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 256
    Environment:
      Variables:
        EVENT_BUS_NAME: !Ref EventBus
        SWITCH_HOST: !Ref SwitchHost
        SWITCH_USER: !Ref SwitchUser
        SWITCH_PASSWORD: !Ref SwitchPassword
        TELEGRAM_BOT_TOKEN: !Ref TelegramBotToken
        TELEGRAM_CHAT_ID: !Ref TelegramChatId
        TELEGRAM_WEBHOOK_SECRET: !Ref TelegramWebhookSecret

Parameters:
  SwitchHost:
    Type: String
    Description: URL base RESTCONF do dispositivo (ex. https://10.0.0.1)
  SwitchUser:
    Type: String
  SwitchPassword:
    Type: String
    NoEcho: true
  TelegramBotToken:
    Type: String
    NoEcho: true
  TelegramChatId:
    Type: String
  TelegramWebhookSecret:
    Type: String
    NoEcho: true

Resources:
  EventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: netguardian-bus

  # ---- Módulo 1: Compliance & Hardening (polling agendado) ------------------
  Module1ComplianceFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/module1_compliance/lambda_handler.lambda_handler
      CodeUri: ../
      Events:
        Schedule:
          Type: Schedule
          Properties:
            Schedule: rate(15 minutes)
            Input: '{"device_id": "switch-01"}'
      Policies:
        - EventBridgePutEventsPolicy:
            EventBusName: !Ref EventBus

  # ---- Módulo 2: Segurança & Ameaças (acionado por novo lote de flows) ------
  Module2ThreatsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/module2_threats/lambda_handler.lambda_handler
      CodeUri: ../
      Environment:
        Variables:
          MODEL_PATH: /opt/model.joblib
      Events:
        Schedule:
          Type: Schedule
          Properties:
            Schedule: rate(5 minutes)
      Policies:
        - EventBridgePutEventsPolicy:
            EventBusName: !Ref EventBus
        - S3ReadPolicy:
            BucketName: !Ref FlowsBucket

  # ---- Módulo 3: Saúde da Infraestrutura (polling agendado, curto) ----------
  Module3HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/module3_health/lambda_handler.lambda_handler
      CodeUri: ../
      Events:
        Schedule:
          Type: Schedule
          Properties:
            Schedule: rate(1 minute)
            Input: '{"device_id": "switch-01"}'
      Policies:
        - EventBridgePutEventsPolicy:
            EventBusName: !Ref EventBus

  # ---- Notifier: consome o barramento e alerta via Telegram -----------------
  NotifierFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/bot/notification_lambda.lambda_handler
      CodeUri: ../
      Events:
        AnomalyEvent:
          Type: EventBridgeRule
          Properties:
            EventBusName: !Ref EventBus
            Pattern:
              source:
                - netguardian

  # ---- Webhook: recebe Aprovar/Rejeitar do Telegram e executa a remediação --
  WebhookFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/bot/telegram_webhook_handler.lambda_handler
      CodeUri: ../
      Events:
        Webhook:
          Type: Api
          Properties:
            Path: /telegram/webhook
            Method: post
            RestApiId: !Ref WebhookApi

  WebhookApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      # TLS em trânsito é padrão no API Gateway (HTTPS only); o webhook ainda
      # valida o X-Telegram-Bot-Api-Secret-Token dentro do handler.

  FlowsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub netguardian-flows-${AWS::AccountId}

Outputs:
  WebhookUrl:
    Description: URL a configurar como webhook do bot (setWebhook da API do Telegram)
    Value: !Sub "https://${WebhookApi}.execute-api.${AWS::Region}.amazonaws.com/prod/telegram/webhook"
  EventBusName:
    Value: !Ref EventBus
